<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>ID Card Worksheet</title>
    <style>
      body { font-family: Monospace, Sans-Serif; max-width: 700px; margin: 40px auto; }
      .card {
        border: 2px solid #333;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 10px;
        background-image: url('https://image.slidesdocs.com/responsive-images/background/airplane-aircraft-colorful-education-child-powerpoint-background_3ada96b3fb__960_540.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: repeat;
      }
      .center-img { display: block; margin-left: auto; margin-right: auto; max-width: 50%; height: auto; }
      label { display: inline-block; width: 280px; margin-right: -10px; font-weight: bold; vertical-align: middle; text-align: left; }
      input, textarea { display: inline-block; width: 30%; padding: 5px; box-sizing: border-box; vertical-align: middle; }
      .form-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
      .place-row label { flex: 0 0 auto; font-weight: bold; white-space: nowrap; }
      .place-row textarea { flex: 1 1 20px; min-width: 10px; padding: 6px 8px; border: 1px solid #999; border-radius: 4px; }
      @media (max-width: 500px) {
        .form-row { flex-direction: column; align-items: flex-start; gap: 6px; }
        .place-row input { width: 30%; }
      }
      button { display: block; margin-left: auto; margin-right: auto; margin-top: 30px; padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; }
      button:hover { background: #45a049; }
      button:disabled { background: #aaa; cursor: not-allowed; }
      #results { margin-top: 20px; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 5px; }
      .error { color: red; font-weight: bold; }
      .ok { color: green; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLg__6S81P_1_yXgXXlgtWnbK6PmFKb5eVPA&s" class="center-img">
      <h2>ID CARD</h2>

      <div class="form-row">
        <label for="name">NAME: My name is</label>
        <input type="text" id="name" placeholder="">
      </div>
      <div class="form-row">
        <label for="country">COUNTRY: I am from</label>
        <input type="text" id="country" placeholder="">
      </div>
      <div class="form-row">
        <label for="nationality">NATIONALITY: I am</label>
        <input type="text" id="nationality" placeholder="">
      </div>
      <div class="form-row">
        <label for="food">FAMOUS FOOD: The famous food is</label>
        <input type="text" id="food" placeholder="">
      </div>
      <div class="form-row place-row">
        <label for="place">POPULAR PLACE:
          <textarea id="place" rows="1" placeholder=""></textarea>
          is a popular place.
        </label>
      </div>
      <div class="form-row place-row">
        <label for="funfact">FUN FACT:
          <textarea id="funfact" rows="1" placeholder=""></textarea>
          is a sunny place.
        </label>
      </div>

      <button id="submitBtn">Submit</button>
    </div>
    <div id="results"></div>

    <script>
      function getValue(id) {
        return document.getElementById(id).value.trim();
      }

      async function checkGrammar() {
        const btn = document.getElementById('submitBtn');
        const resultsDiv = document.getElementById('results');

        btn.disabled = true;
        btn.textContent = 'Checking...';
        resultsDiv.innerHTML = '<p>Checking grammar...</p>';

        // Build full sentences, skip fields the user left blank
        const fields = [
          { label: 'Name',        sentence: 'My name is '         + getValue('name') },
          { label: 'Country',     sentence: 'I am from '          + getValue('country') },
          { label: 'Nationality', sentence: 'I am '               + getValue('nationality') },
          { label: 'Food',        sentence: 'The famous food is '  + getValue('food') },
          { label: 'Place',       sentence: getValue('place')      + ' is a popular place.' },
          { label: 'Fun fact',    sentence: getValue('funfact')    + ' is a sunny place.' },
        ].filter(f => {
          // Only include if the user actually typed something (not just the prefix alone)
          const prefixes = ['My name is ', 'I am from ', 'I am ', 'The famous food is ', ' is a popular place.', ' is a sunny place.'];
          return f.sentence.trim().length > 0 &&
                 !prefixes.some(p => f.sentence.trim() === p.trim());
        });

        if (fields.length === 0) {
          resultsDiv.innerHTML = '<p class="error">Please fill in at least one field!</p>';
          btn.disabled = false;
          btn.textContent = 'Submit';
          return;
        }

        // Check each sentence individually so we can label which field had the error
        let anyErrors = false;
        let html = '';

        for (const field of fields) {
          try {
            const params = new URLSearchParams({
              text: field.sentence,
              language: 'en-US',
            });

            const response = await fetch('https://api.languagetool.org/v2/check', {
              method: 'POST',
              headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
              body: params.toString(),
            });

            if (!response.ok) throw new Error('LanguageTool API error: ' + response.status);

            const data = await response.json();
            const matches = data.matches;

            if (matches.length === 0) {
              html += `<p class="ok">✅ <strong>${field.label}:</strong> "${field.sentence}" — looks good!</p>`;
            } else {
              anyErrors = true;
              html += `<p><strong>❌ ${field.label}:</strong> "${field.sentence}"</p><ul>`;
              for (const match of matches) {
                const snippet = field.sentence.substring(match.offset, match.offset + match.length);
                const suggestions = match.replacements.slice(0, 3).map(r => `<strong>${r.value}</strong>`).join(' or ');
                html += `<li>
                  <span class="error">"${snippet}"</span>${suggestions ? ' → ' + suggestions : ''}<br>
                  <small>${match.message}</small>
                </li>`;
              }
              html += '</ul>';
            }
          } catch (err) {
            html += `<p class="error">Could not check <strong>${field.label}</strong>: ${err.message}</p>`;
          }
        }

        if (!anyErrors) {
          html = '<p class="ok" style="font-size:1.1em;">🎉 Perfect! No grammar mistakes found.</p>' + html;
        }

        resultsDiv.innerHTML = html;
        btn.disabled = false;
        btn.textContent = 'Submit';
      }

      document.getElementById('submitBtn').addEventListener('click', checkGrammar);
    </script>
  </body>
</html>
