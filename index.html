<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <title>ID Card Worksheet</title>
    <style>
      body { font-family: Monospace, Sans-Serif; max-width: 700px; margin: 40px auto; }
      .card {
        border: 2px solid #333;
        padding: 20px;
        background: #f9f9f9;
        border-radius: 10px;
        background-image: url('https://image.slidesdocs.com/responsive-images/background/airplane-aircraft-colorful-education-child-powerpoint-background_3ada96b3fb__960_540.jpg');
        background-size: cover;
        background-position: center;
        background-repeat: repeat;
      }
      .center-img { display: block; margin-left: auto; margin-right: auto; max-width: 50%; height: auto; }
      label { display: inline-block; width: 280px; margin-right: -10px; font-weight: bold; vertical-align: middle; text-align: left; }
      input, textarea { display: inline-block; width: 30%; padding: 5px; box-sizing: border-box; vertical-align: middle; }
      .form-row { display: flex; align-items: center; gap: 8px; margin: 12px 0; flex-wrap: wrap; }
      .place-row label { flex: 0 0 auto; font-weight: bold; white-space: nowrap; }
      .place-row textarea { flex: 1 1 20px; min-width: 10px; padding: 6px 8px; border: 1px solid #999; border-radius: 4px; }
      @media (max-width: 500px) {
        .form-row { flex-direction: column; align-items: flex-start; gap: 6px; }
        .place-row input { width: 30%; }
      }
      button { display: block; margin-left: auto; margin-right: auto; margin-top: 30px; padding: 10px 20px; background: #4CAF50; color: white; border: none; cursor: pointer; border-radius: 4px; font-size: 16px; }
      button:hover { background: #45a049; }
      button:disabled { background: #aaa; cursor: not-allowed; }
      #results { margin-top: 20px; padding: 15px; background: #fff3cd; border: 1px solid #ffeeba; border-radius: 5px; }
      .error { color: red; font-weight: bold; }
    </style>
  </head>
  <body>
    <div class="card">
      <img src="https://encrypted-tbn0.gstatic.com/images?q=tbn:ANd9GcSLg__6S81P_1_yXgXXlgtWnbK6PmFKb5eVPA&s" class="center-img">
      <h2>ID CARD</h2>

      <div class="form-row">
        <label for="name">NAME: My name is</label>
        <input type="text" id="name" placeholder="">
      </div>
      <div class="form-row">
        <label for="country">COUNTRY: I am from</label>
        <input type="text" id="country" placeholder="">
      </div>
      <div class="form-row">
        <label for="nationality">NATIONALITY: I am</label>
        <input type="text" id="nationality" placeholder="">
      </div>
      <div class="form-row">
        <label for="food">FAMOUS FOOD: The famous food is</label>
        <input type="text" id="food" placeholder="">
      </div>
      <div class="form-row place-row">
        <label for="place">POPULAR PLACE:
          <textarea id="place" rows="1" placeholder=""></textarea>
          is a popular place.
        </label>
      </div>
      <div class="form-row place-row">
        <label for="funfact">FUN FACT:
          <textarea id="funfact" rows="1" placeholder=""></textarea>
          is a sunny place.
        </label>
      </div>

      <button id="submitBtn">Submit</button>
    </div>
    <div id="results"></div>

    <script type="module">
      // Pinned to 1.2.0 (latest as of now) — change version here if you upgrade
      import { binaryInlined, WorkerLinter } from 'https://unpkg.com/harper.js@1.2.0/dist/harper.js';

      const linter = new WorkerLinter({ binary: binaryInlined });

      async function checkGrammar() {
        const btn = document.getElementById('submitBtn');
        const resultsDiv = document.getElementById('results');

        btn.disabled = true;
        btn.textContent = 'Checking...';
        resultsDiv.innerHTML = '<p>Checking grammar with Harper...</p>';

        const fields = [
          'My name is '         + document.getElementById('name').value.trim(),
          'I am from '          + document.getElementById('country').value.trim(),
          'I am '               + document.getElementById('nationality').value.trim(),
          'The famous food is ' + document.getElementById('food').value.trim(),
          document.getElementById('place').value.trim()   + ' is a popular place.',
          document.getElementById('funfact').value.trim() + ' is a sunny place.',
        ].filter(s => s.trim().length > 20);

        if (fields.length === 0) {
          resultsDiv.innerHTML = '<p class="error">Please fill in at least one field!</p>';
          btn.disabled = false;
          btn.textContent = 'Submit';
          return;
        }

        const fullText = fields.join('\n\n');

        try {
          const lints = await linter.lint(fullText);

          btn.disabled = false;
          btn.textContent = 'Submit';

          if (lints.length === 0) {
            resultsDiv.innerHTML = '<p style="color:green;font-weight:bold;">✅ Perfect! No grammar issues found.</p>';
            return;
          }

          let html = `<p><strong>Harper found ${lints.length} issue(s):</strong></p><ul>`;
          for (const lint of lints) {
            // v1.x API: message() and span() are METHODS, not properties
            const span = lint.span();
            const snippet = fullText.substring(span.start, span.end);
            const message = lint.message();

            // suggestions() returns an array of suggestion objects with a .value property
            let suggestionText = 'No suggestion available';
            try {
              const sugs = lint.suggestions();
              if (sugs && sugs.length > 0) {
                suggestionText = sugs.map(s => `<strong>${s.value ?? s}</strong>`).join(' or ');
              }
            } catch (_) {}

            html += `<li>
              <span class="error">"${snippet}"</span> → ${suggestionText}<br>
              <small>${message}</small>
            </li>`;
          }
          html += '</ul>';
          resultsDiv.innerHTML = html;

        } catch (err) {
          btn.disabled = false;
          btn.textContent = 'Submit';
          resultsDiv.innerHTML = `<p class="error">Error: ${err.message}</p><p>Check the browser console (F12) for details.</p>`;
          console.error('Harper error:', err);
        }
      }

      document.getElementById('submitBtn').addEventListener('click', checkGrammar);
    </script>
  </body>
</html>
